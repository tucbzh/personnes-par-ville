<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carte interactive — répartition autour de Rennes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:Arial,sans-serif}
#controls{position:absolute;z-index:1000;top:12px;left:12px;width:310px;max-height:calc(100% - 24px);overflow:auto;background:#fff;padding:12px 14px;border-radius:9px;box-shadow:0 2px 12px #0003;font-size:13px}
h3{margin:0 0 8px;font-size:16px}
label{display:block;margin:8px 0 4px;font-weight:600}
input[type=search],input[type=number]{width:100%;box-sizing:border-box;padding:7px;border:1px solid #bbb;border-radius:5px}
.row{display:flex;gap:7px}
.row>div{flex:1}
button{padding:7px 9px;border:1px solid #aaa;border-radius:5px;background:#f7f7f7;cursor:pointer;margin:5px 3px 0 0}
.small{font-size:11px;color:#666}
#results{margin-top:5px;max-height:150px;overflow:auto}
.result{padding:5px;border-bottom:1px solid #eee;cursor:pointer}
.result:hover{background:#f1f1f1}
.legend{margin-top:10px;border-top:1px solid #ddd;padding-top:8px}
.lrow{display:flex;align-items:center;gap:7px;margin:3px 0}
.swatch{width:15px;height:10px;border-radius:2px;display:inline-block}
#count{margin-top:7px;font-weight:600}

#toggleControls{
  position:absolute;z-index:1100;top:12px;left:12px;
  width:44px;height:44px;border:0;border-radius:22px;
  background:white;box-shadow:0 2px 10px #0004;
  font-size:21px;cursor:pointer;
}
#controls{transition:opacity .15s,transform .15s}
#controls.collapsed{display:none}
#controls:not(.collapsed){display:block}
@media (min-width:700px){
  #toggleControls{display:none}
  #controls{display:block!important}
}
@media (max-width:699px){
  #controls{
    top:64px;left:10px;width:calc(100% - 20px);
    max-height:calc(100% - 74px);
    box-sizing:border-box;
  }
  #controlsPanel{max-height:inherit;overflow:auto}
}
</style>
</head>

const toggleControls=document.getElementById('toggleControls');
const controls=document.getElementById('controls');
toggleControls.addEventListener('click',()=>{
  const open=controls.classList.toggle('collapsed')===false;
  toggleControls.setAttribute('aria-expanded',String(open));
  toggleControls.textContent=open?'×':'☰';
  toggleControls.title=open?'Masquer les contrôles':'Afficher les contrôles';
});

const map=L.map('map',{preferCanvas:true}).setView(RENNES,9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

const markers=L.layerGroup().addTo(map);
const rings=L.layerGroup().addTo(map);
const deps=L.layerGroup().addTo(map);

function zoneIndex(d){return Math.min(10,Math.floor(d/10));}
function color(d){return zoneColors[zoneIndex(d)];}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

function buildRings(){
  rings.clearLayers();
  for(let r=10;r<=Math.ceil(maxDataDistance/10)*10;r+=10){
    L.circle(RENNES,{radius:r*1000,color:'#555',weight:r%50===0?1.2:0.45,opacity:r%50===0?0.35:0.13,fill:false,interactive:false})
      .bindTooltip(r+' km',{sticky:true,opacity:.75})
      .addTo(rings);
  }
}
buildRings();

function update(){
  const minp=Math.max(0,Number(document.getElementById('minp').value)||0);
  const maxRaw=document.getElementById('maxp').value;
  const maxp=maxRaw===''?Infinity:Math.max(0,Number(maxRaw));
  const md=Math.max(0,Number(document.getElementById('maxdist').value)||0);
  markers.clearLayers();
  let shown=0,total=0;
  places.forEach(p=>{
    if(p.personnes<minp || p.personnes>maxp || p.distance>md) return;
    shown++; total+=p.personnes;
    const radius=4+Math.sqrt(p.personnes)*3.1;
    const m=L.circleMarker([p.lat,p.lon],{radius,color:'#333',weight:.7,fillColor:color(p.distance),fillOpacity:.76});
    m.bindPopup('<b>'+escapeHtml(p.ville)+'</b><br>Personnes : <b>'+p.personnes+'</b><br>Distance de Rennes : '+p.distance+' km<br>Zone : '+escapeHtml(p.zone)+'<br>Code INSEE : '+p.insee+'<br>Département : '+escapeHtml(p.departement));
    m.addTo(markers);
  });
  document.getElementById('count').textContent=shown+' commune(s) affichée(s) · '+total+' personne(s)';
}

L.circleMarker(RENNES,{radius:9,color:'#8b0000',fillColor:'#e31a1c',fillOpacity:1,weight:2})
 .bindTooltip('<b>RENNES</b>',{permanent:true,direction:'right'}).addTo(map);

function loadDepartments(){
  const url='https://geo.api.gouv.fr/departements?geometry=contour&format=geojson';
  fetch(url).then(r=>r.json()).then(g=>{
    deps.clearLayers();
    L.geoJSON(g,{style:{color:'#555',weight:1.2,opacity:.5,fill:false}})
      .bindTooltip(layer=>layer.feature?.properties?.nom || '',{sticky:true})
      .addTo(deps);
  }).catch(()=>{});
}
loadDepartments();

function search(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const box=document.getElementById('results');
  box.innerHTML='';
  if(!q) return;
  const matches=places.filter(p=>p.ville.toLowerCase().includes(q) || p.source.toLowerCase().includes(q) || p.insee.includes(q)).slice(0,12);
  matches.forEach(p=>{
    const d=document.createElement('div'); d.className='result';
    d.innerHTML='<b>'+escapeHtml(p.ville)+'</b> — '+p.personnes+' pers. — '+p.distance+' km';
    d.onclick=()=>{map.setView([p.lat,p.lon],13); L.popup().setLatLng([p.lat,p.lon]).setContent('<b>'+escapeHtml(p.ville)+'</b><br>Personnes : <b>'+p.personnes+'</b><br>Distance : '+p.distance+' km<br>Code INSEE : '+p.insee).openOn(map);};
    box.appendChild(d);
  });
  if(!matches.length) box.textContent='Aucune commune trouvée.';
}

document.getElementById('search').addEventListener('input',search);
['minp','maxp','maxdist'].forEach(id=>document.getElementById(id).addEventListener('input',update));
document.getElementById('reset').onclick=()=>{
  document.getElementById('search').value='';
  document.getElementById('minp').value=0;
  document.getElementById('maxp').value='';
  document.getElementById('maxdist').value=Math.ceil(maxDataDistance/10)*10;
  document.getElementById('results').innerHTML='';
  update();
};
document.getElementById('fit').onclick=()=>map.fitBounds(L.latLngBounds(places.map(p=>[p.lat,p.lon])),{padding:[30,30]});
document.getElementById('rennes').onclick=()=>map.fitBounds([[45.9,-4.2],[50.1,1.0]],{padding:[20,20]});
document.getElementById('rings').onchange=e=>e.target.checked?rings.addTo(map):map.removeLayer(rings);
document.getElementById('deps').onchange=e=>e.target.checked?deps.addTo(map):map.removeLayer(deps);

update();
</script>
</body>
</html>
